name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Safety net, not a target and not an expected duration: the
    # differential/fuzz suites spawn a real `sh` (which itself spawns
    # `git`/`awk`) per generated case, thousands of times across the fuzz
    # files. On windows-latest that per-process overhead was observed to
    # make the full suite run past 45 minutes with no other progress --
    # indistinguishable in the UI from a genuine hang -- and, once the
    # cross-platform evaluator-shell-driven Windows coverage added in
    # later rounds is included, past the previous 40-minute ceiling even
    # though every test was still genuinely progressing (compiled
    # successfully and passed hundreds of tests before being cut off).
    # 60 minutes is a hard safety CEILING against a silent runaway, not a
    # target to shrink toward -- SHIELD_FUZZ_CASES below is the actual fix
    # for the fuzz-suite overhead itself; this number exists only to turn
    # "silently burns the runner for hours" into a loud, bounded failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Node 22, not 20: several of @vscode/vsce's own transitive
      # dependencies (the @azure/* packages its Azure DevOps PAT auth path
      # pulls in) declare "engines.node": ">=22.0.0" -- Node 20 npm-installs
      # them anyway (npm warns, doesn't block), but that's exactly the
      # "tooling wants a newer Node than CI provides" mismatch, and it's
      # dev/build tooling only. This does NOT touch package.json's
      # "engines.vscode" -- the shipped extension's own minimum VS Code
      # version is unrelated to what Node this workflow builds it with.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile

      # ShellCheck, on the Linux leg only. Shield's enforcement is POSIX
      # shell, and a bashism or syntax slip there does not fail at build
      # time -- it fails at `git commit` time on a machine whose /bin/sh is
      # dash or BusyBox ash, where the v5 fail-CLOSED shims then block
      # every commit and push in the repository. `shellcheck` ships in the
      # ubuntu-latest image, so this needs no install step and no
      # third-party action; `-s sh` forces POSIX mode so a bashism is an
      # error rather than an accepted convenience. Every generated hook is
      # analyzed too, by the test suite itself
      # (src/test/shieldShellStaticAnalysis.test.ts), which skips this tool
      # gracefully when it is absent rather than failing.
      - name: ShellCheck the shipped evaluator (POSIX sh mode)
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh resources/shield/shield-evaluate.sh

      # Full fuzz/differential depth (SHIELD_FUZZ_CASES unset -> each
      # harness's own default, currently up to ~900 cases) runs on every
      # OS except Windows. Each fuzz case spawns a real `sh` process
      # (itself spawning `git`/`awk`), and Windows process-creation
      # overhead is high enough that the unscaled suite was observed to
      # still be running 45+ minutes in with no further progress -- see
      # the job-level timeout-minutes comment above. This does not reduce
      # what the *generators* cover (same boundary-biased cases, same
      # assertions) -- only how many of them run on this one slow
      # platform; the full sweep still runs on ubuntu-latest and
      # macos-latest on every CI run, and locally with
      # `SHIELD_FUZZ_CASES=<n> npm test` on any platform.
      - run: npm test
        env:
          SHIELD_FUZZ_CASES: ${{ matrix.os == 'windows-latest' && '60' || '' }}
